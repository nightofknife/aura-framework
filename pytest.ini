[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: fast unit-level regression coverage.
    api: API surface and entrypoint behavior.
    security: API exposure, auth, and remote-mode boundaries.
    desktop: Windows desktop service import and smoke coverage.
    yolo: optional YOLO profile coverage that requires the yolo dependency profile.
    slow: longer-running integration or model-backed coverage.
